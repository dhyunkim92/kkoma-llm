# Kkoma-1.3B-Ko-Base (spec 19). Korean continued pretraining from the 1.3B Base.
# Run with: scripts/train_continued.py --init-from <base-1.3b final.pt>
# v1 default: start from a FRESH optimizer state (do not pass --resume).
project:
  name: kkoma-llm
  run_name: ko-1.3b-cpt-2b
  seed: 42
  data_seed: 42
  init_seed: 42
  sampling_seed: 1234

model:
  vocab_size: 32768
  context_length: 1024
  n_layer: 24
  d_model: 2048
  n_head: 32
  n_kv_head: 8
  head_dim: 64
  norm: rmsnorm
  positional_encoding: rope
  activation: swiglu
  rope_theta: 10000.0
  tie_word_embeddings: true
  bias: false
  dropout: 0.0

tokenizer:
  path: artifacts/tokenizer

data:
  sampling_seed: 42
  min_doc_chars: 16
  sources:
    - { name: fineweb2-korean, path: "data/korean/train_ko/*.jsonl", weight: 0.70, text_key: text }
    - { name: english-replay, path: "data/korean/train_en/*.jsonl", weight: 0.30, text_key: text }
  val_sources:
    - { name: en, path: "data/korean/val_en/*.jsonl", weight: 1.0, text_key: text }
    - { name: ko, path: "data/korean/val_ko/*.jsonl", weight: 1.0, text_key: text }

training:
  precision: fp16
  global_batch_tokens: 262144
  micro_batch_size: 2
  max_tokens: 2000000000
  grad_clip: 1.0
  log_interval: 10
  eval_interval: 1000
  downstream_interval: 1000

optimizer:
  name: adamw
  learning_rate: 0.00005
  beta1: 0.9
  beta2: 0.95
  weight_decay: 0.1

scheduler:
  name: cosine
  warmup_ratio: 0.02
  min_lr_ratio: 0.1

distributed:
  backend: nccl

evaluation:
  # Frozen benchmark sets from scripts/prepare_downstream_data.py. Flip
  # downstream_enabled to false, or enabled on a single task, to skip them.
  downstream_enabled: true
  downstream_batch_size: 16
  downstream_tasks:
  - name: hellaswag
    path: data/downstream/hellaswag.jsonl
    language: en
    enabled: true
  - name: arc_easy
    path: data/downstream/arc_easy.jsonl
    language: en
    enabled: true
  - name: kobest_hellaswag
    path: data/downstream/kobest_hellaswag.jsonl
    language: ko
    enabled: true

logging:
  backend: wandb
  project: kkoma-llm-cpt

checkpoint:
  dir: artifacts/checkpoints/ko-1.3b-cpt2b
  save_interval: 1000
  keep_last: 3
  save_best: true
