# Kkoma-1B-Ko-Base (spec 19). Korean continued pretraining from the 1B Base.
# Run with: scripts/train_continued.py --init-from <base-1b final.pt>
# v1 default: start from a FRESH optimizer state (do not pass --resume).
project:
  name: kkoma-llm
  run_name: ko-1b-cpt-2b
  seed: 42
  data_seed: 42
  init_seed: 42
  sampling_seed: 1234

model:
  vocab_size: 32768
  context_length: 1024
  n_layer: 24
  d_model: 1792
  n_head: 28
  n_kv_head: 7
  head_dim: 64
  norm: rmsnorm
  positional_encoding: rope
  activation: swiglu
  rope_theta: 10000.0
  tie_word_embeddings: true
  bias: false
  dropout: 0.0

tokenizer:
  path: artifacts/tokenizer

data:
  sampling_seed: 42
  min_doc_chars: 16
  sources:
    - { name: fineweb2-korean, path: "data/korean/train_ko/*.jsonl", weight: 0.70, text_key: text }
    - { name: english-replay, path: "data/korean/train_en/*.jsonl", weight: 0.30, text_key: text }
  val_sources:
    - { name: en, path: "data/korean/val_en/*.jsonl", weight: 1.0, text_key: text }
    - { name: ko, path: "data/korean/val_ko/*.jsonl", weight: 1.0, text_key: text }

training:
  precision: fp16
  global_batch_tokens: 262144
  micro_batch_size: 2
  max_tokens: 2000000000
  grad_clip: 1.0
  log_interval: 10
  eval_interval: 1000
  downstream_interval: 1000

optimizer:
  name: adamw
  learning_rate: 0.00005
  beta1: 0.9
  beta2: 0.95
  weight_decay: 0.1

scheduler:
  name: cosine
  warmup_ratio: 0.02
  min_lr_ratio: 0.1

distributed:
  backend: nccl

evaluation:
  # Frozen benchmark sets from scripts/prepare_downstream_data.py. Flip
  # downstream_enabled to false, or enabled on a single task, to skip them.
  downstream_enabled: true
  downstream_batch_size: 16
  downstream_tasks:
  # Scored during training (light 3-task set) and again in the final evaluation.
  - name: hellaswag
    path: data/downstream/hellaswag.jsonl
    language: en
  - name: arc_easy
    path: data/downstream/arc_easy.jsonl
    language: en
  - name: kobest_hellaswag
    path: data/downstream/kobest_hellaswag.jsonl
    language: ko
  # Final evaluation only (scripts/evaluate.py). during_training: false keeps the
  # in-training benchmark cadence light; the post-training run scores them all.
  - name: piqa
    path: data/downstream/piqa.jsonl
    language: en
    during_training: false
  - name: arc_challenge
    path: data/downstream/arc_challenge.jsonl
    language: en
    during_training: false
  - name: boolq
    path: data/downstream/boolq.jsonl
    language: en
    during_training: false
  - name: winogrande
    path: data/downstream/winogrande.jsonl
    language: en
    during_training: false
  - name: openbookqa
    path: data/downstream/openbookqa.jsonl
    language: en
    during_training: false
  - name: kobest_copa
    path: data/downstream/kobest_copa.jsonl
    language: ko
    during_training: false
  - name: kobest_boolq
    path: data/downstream/kobest_boolq.jsonl
    language: ko
    during_training: false
  - name: kobest_sentineg
    path: data/downstream/kobest_sentineg.jsonl
    language: ko
    during_training: false
  - name: kobest_wic
    path: data/downstream/kobest_wic.jsonl
    language: ko
    during_training: false

logging:
  backend: wandb
  project: kkoma-llm-cpt

checkpoint:
  dir: artifacts/checkpoints/ko-1b-cpt2b
  save_interval: 1000
  keep_last: 3
  save_best: true
