# Architecture Study (350M scale, progressive): RoPE + RMSNorm + SwiGLU.
project:
  name: kkoma-llm
  run_name: core-350m-rope-rmsnorm-swiglu-seed42
  seed: 42
  data_seed: 42
  init_seed: 42
  sampling_seed: 1234
model:
  vocab_size: 32768
  context_length: 1024
  n_layer: 24
  d_model: 1024
  n_head: 16
  head_dim: 64
  tie_word_embeddings: true
  bias: false
  dropout: 0.0
  positional_encoding: rope
  norm: rmsnorm
  activation: swiglu
  # Pinned to match the GELU arm's FFN parameter count. The derived
  # value rounds 8/3*1024 up to 2816 (a multiple of 128), which gives
  # SwiGLU 3.1% more FFN parameters than GELU's 2*1024*4096 and turns
  # an activation comparison into a size comparison. 2752 is the
  # nearest multiple of 64 to exact parity (2730.7) and lands at +0.8%.
  d_ff: 2752
  n_kv_head: 16
tokenizer:
  path: artifacts/tokenizer
data:
  sampling_seed: 42
  min_doc_chars: 16
  sources:
  - name: fineweb-edu
    path: data/architecture/train/*.jsonl
    weight: 0.95
    text_key: text
  - name: fineweb2-korean
    path: data/architecture/train_ko/*.jsonl
    weight: 0.05
    text_key: text
  val_sources:
  - name: fineweb-edu-en
    path: data/architecture/val/*.jsonl
    weight: 1.0
    text_key: text
  - name: fineweb2-korean-ko
    path: data/architecture/val_ko/*.jsonl
    weight: 1.0
    text_key: text
training:
  precision: fp16
  global_batch_tokens: 131072
  micro_batch_size: 4
  max_tokens: 300000000
  grad_clip: 1.0
  log_interval: 10
  eval_interval: 100
  eval_tokens: 1048576
optimizer:
  name: adamw
  learning_rate: 0.0006
  beta1: 0.9
  beta2: 0.95
  weight_decay: 0.1
scheduler:
  name: cosine
  warmup_ratio: 0.02
  min_lr_ratio: 0.1
logging:
  backend: wandb
  project: kkoma-llm-core
checkpoint:
  dir: artifacts/checkpoints/core-350m-rope-rmsnorm-swiglu
  save_interval: 1000
  keep_last: 3
  save_best: true
