# Kkoma-1B-Base (L24 d1792 h28 kv7, ~879M params). 9B-token budget (tpp ~10).
# Measured peak on one V100 32GB (seq 1024, fp16 autocast + AdamW):
#   micro_bs=1 -> 15.4 GB, micro_bs=2 -> 18.4 GB, micro_bs=4 -> 24.0 GB.
# micro_bs=2 (grad_accum auto-derives to 16 for the 262,144-token global batch
# at world_size 8) leaves ~14 GB headroom; drop to 1 only if memory is tight.
project:
  name: kkoma-llm
  run_name: base-1b-tpp10
  seed: 42
  data_seed: 42
  init_seed: 42
  sampling_seed: 1234
model:
  vocab_size: 32768
  context_length: 1024
  n_layer: 24
  d_model: 1792
  n_head: 28
  n_kv_head: 7
  head_dim: 64
  norm: rmsnorm
  positional_encoding: rope
  activation: swiglu
  rope_theta: 10000.0
  tie_word_embeddings: true
  bias: false
  dropout: 0.0
tokenizer:
  path: artifacts/tokenizer
data:
  sampling_seed: 42
  min_doc_chars: 16
  sources:
  - name: fineweb-edu
    path: data/pretrain/train/*.jsonl
    weight: 0.95
    text_key: text
  - name: fineweb2-korean
    path: data/pretrain/train_ko/*.jsonl
    weight: 0.05
    text_key: text
  val_sources:
  - name: en
    path: data/pretrain/val/*.jsonl
    weight: 1.0
    text_key: text
  - name: ko
    path: data/pretrain/val_ko/*.jsonl
    weight: 1.0
    text_key: text
training:
  precision: fp16
  global_batch_tokens: 262144
  micro_batch_size: 2
  max_tokens: 9000000000
  grad_clip: 1.0
  log_interval: 10
  eval_interval: 1000
optimizer:
  name: adamw
  learning_rate: 0.00018
  beta1: 0.9
  beta2: 0.95
  weight_decay: 0.1
scheduler:
  name: cosine
  warmup_ratio: 0.02
  min_lr_ratio: 0.1
distributed:
  backend: nccl
logging:
  backend: wandb
  project: kkoma-llm-pt
checkpoint:
  dir: artifacts/checkpoints/base-1b
  save_interval: 1000
  keep_last: 3
  save_best: true
